<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于这个项目</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #43e97b, #38f9d7);
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 380px;
    }
    h1 { margin-top: 0; color: #2d8f5a; text-align: center; }
    ol { line-height: 2; color: #444; }
    .version {
      text-align: center;
      background: #f0fdf4;
      padding: 10px;
      border-radius: 8px;
      color: #2d8f5a;
      font-weight: bold;
    }
    a {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2d8f5a;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>部署流程 🛠️</h1>
    <ol>
      <li>在 VS Code 编写代码</li>
      <li>提交并推送到 GitHub</li>
      <li>Vercel 自动检测更新</li>
      <li>几十秒后网站自动上线</li>
    </ol>
    <div class="version">当前版本：v1</div>
    <a href="/">← 啦啦啦</a>
  </div>
</body>
</html>
